  const r=await(await fetch2('/api/patient/'+u)).json();
  if(!r.found){body.innerHTML='<div class="card">אין נתונים</div>';return;}
  body.innerHTML='';
  const i=r.info;
  const kp=C('div',{className:'kpis'});
  [['מטפל',i.therapist||'—',''],['אבחנה',i['Primary Diagnosis']||'—',''],
   ['גיל / מין',`${i.Age} · ${i.Gender==='male'?'גבר':'אישה'}`,''],
   ['מפגשים',NF.format(i.n_sessions||0),`${i.n_weeks_complete||0} שבועות מלאים`],
   ['מדידות',NF.format(i.n_occasions||0),`${i.n_complete_occasions||0} מלאות`],
   ['היענות',i.n_occasions?pct((i.n_responded_occasions||0)/i.n_occasions):'—','']
  ].forEach(([l,v,n])=>{const x=C('div',{className:'kpi'});
    x.innerHTML=`<div class="lab">${l}</div><div class="val" style="font-size:17px">${v}</div><div class="note">${n}</div>`;kp.appendChild(x);});
  body.appendChild(kp);
  if(r.meta.review_flag) body.appendChild(C('div',{className:'hint',
    innerHTML:`<b>מסומן לבדיקה:</b> ${r.meta.review_flag}`}));

  const byQ={}; r.occasions.forEach(o=>{(byQ[o.questionnaire]??=[]).push(o);});
  const qs=Object.keys(byQ).sort((a,b)=>byQ[b].length-byQ[a].length);
  qs.forEach(q=>{
    const rows=byQ[q].slice().sort((a,b)=>a.date<b.date?-1:1);
    const withScore=rows.filter(o=>o.total_score!==null&&o.total_score!==undefined&&o.total_score!=='');
    const el=C('div');
    if(withScore.length>=2){
      el.appendChild(lineChart(withScore.map(o=>({month:o.date.slice(2,7),date:o.date,
          v:+o.total_score,sent:1,answered:1})),
        // small score ranges need a decimal, or the axis prints "3,3,2,1,0"
        {x:'month',y:'v',w:820,h:170,label:'ציון',
         fmt:v=>Math.max(...withScore.map(o=>+o.total_score))<8?v.toFixed(1):v.toFixed(0)}));
    }
    el.appendChild(stripChart(rows));
    const lg=C('div',{className:'legend'});
    lg.innerHTML=`<i style="background:${cssv('--good')};height:11px"></i><span>נענה במלואו</span>
      <i style="background:${cssv('--warn')};height:6px"></i><span>חלקי</span>
      <i style="background:${cssv('--s8')};height:5px"></i><span>הוחזר ריק</span>
      <i style="background:${cssv('--line')};height:3px"></i><span>נשלח ולא נענה</span>`;
    el.appendChild(lg);
    const nResp=rows.filter(o=>o.completeness==='complete'||o.completeness==='partial').length;
    body.appendChild(box(q,`${rows.length} נשלחו · ${nResp} נענו`,el));
  });
}

function stripChart(rows){
  const NS='http://www.w3.org/2000/svg', cw=13, w=Math.max(300,rows.length*cw+10), h=30;
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('width',w);svg.setAttribute('height',h);
  svg.setAttribute('direction','ltr');
  // colour AND height carry the state, so the three levels stay distinguishable
  // for a colour-blind reader: full block = answered, half = partial, thin rule = never answered
  const spec={complete:{c:cssv('--good'),h:16,y:7},
              partial:{c:cssv('--warn'),h:9,y:11},
              empty:{c:cssv('--s8'),h:6,y:12},
              not_answered:{c:cssv('--line'),h:3,y:14}};
  const LAB={complete:'נענה במלואו',partial:'נענה חלקית',
             empty:'הוחזר ריק לגמרי',not_answered:'נשלח ולא נענה'};
  rows.forEach((o,i)=>{
    const s=spec[o.completeness]||spec.not_answered;
    const r=document.createElementNS(NS,'rect');
    r.setAttribute('x',5+i*cw);r.setAttribute('y',s.y);r.setAttribute('width',cw-3);
    r.setAttribute('height',s.h);r.setAttribute('rx',2);
    r.setAttribute('fill',s.c);
    r.style.cursor='pointer';
    const lab=LAB[o.completeness]||o.completeness;
    r.addEventListener('mousemove',e=>tip(e,`<b>${o.date}</b><br>${lab}<br>${o.n_active_answered}/${o.n_active_items} פריטים${o.total_score?'<br>ציון: '+o.total_score:''}`));
    r.addEventListener('mouseleave',untip);
    svg.appendChild(r);
  });
  return svg;
}

async function upload(file){

const VSTATE={ok:['vb-ok','✓ שחזור אומת'],failed:['vb-bad','✕ השחזור נכשל'],
  stale:['vb-stale','⚠ הנתונים השתנו מאז האימות'],never:['vb-never','○ טרם אומת']};

function worstState(v){
  const s=[v.roundtrip.state,v.reproduce.state];
  if(s.includes('failed'))return 'failed';
  if(s.includes('never'))return 'never';
  if(s.includes('stale'))return 'stale';
  return 'ok';
}
function renderBadge(){
  const v=S.verification; if(!v)return;
  const st=worstState(v), [cls,txt]=VSTATE[st];
  const b=$('#vbadge');
  b.innerHTML=`<span class="vb ${cls}" title="לחיצה פותחת את לשונית האימות">${txt}</span>`;
  b.onclick=()=>document.querySelector('nav button[data-p=ver]').click();
}
function stateRow(label,e){
  const [cls,txt]=VSTATE[e.state];

const verdict=(ok,txt)=>`<div class="card" style="margin:0 0 14px;border-color:${ok?cssv('--good'):cssv('--bad')};
  background:color-mix(in srgb,${ok?cssv('--good'):cssv('--bad')} 8%,var(--surface))">

async function runRoundtrip(){
  const b=$('#rt_go'), box=$('#rt_res');
  b.disabled=true; box.innerHTML='<div class="spin">בודק…</div>';
  const r=await(await fetch2('/api/verify/roundtrip',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({n:+$('#rt_n').value})})).json();
  b.disabled=false;
  if(r.msg&&!r.checked){box.innerHTML=`<div class="hint">${r.msg}</div>`;return;}
  let h=verdict(r.ok, r.ok
    ? `${NF.format(r.checked)} תאים נבדקו מול הקובץ <span dir="ltr">${r.file}</span> — אפס פערים. כל חמש בדיקות המבנה עברו`
    : `${NF.format(r.mismatches)} פערים מתוך ${NF.format(r.checked)} תאים שנבדקו`);
  h+=`<table style="margin-bottom:14px"><tbody>
    <tr><td>קובץ המקור שנבדק</td><td class="mono" dir="ltr">${r.file}</td></tr>
    <tr><td>תאים שנבדקו</td><td class="mono">${NF.format(r.checked)}</td></tr>
    <tr><td>פערים</td><td class="mono">${NF.format(r.mismatches)}</td></tr>
    <tr><td>מתוך אוכלוסייה של</td><td class="mono">${NF.format(r.population)} תאים</td></tr>
  </tbody></table>`;
  h+='<table><thead><tr><th>בדיקת מבנה</th><th>תוצאה</th></tr></thead><tbody>'+
    r.structural.map(x=>`<tr><td>${x.name}</td><td>${x.ok?
      `<span class="badge b-ok">עבר</span>`:`<span class="badge b-low">נכשל</span>`}</td></tr>`).join('')+
    '</tbody></table>';
  if(r.examples&&r.examples.length) h+=`<h2 style="margin-top:18px;font-size:14px">דוגמאות לפערים</h2>
    <table><thead><tr><th>מה</th><th>שאלון</th><th>פריט</th><th>במקור</th><th>במסד הנקי</th></tr></thead><tbody>${
      r.examples.map(e=>`<tr><td>${e.what}</td><td>${e.q}</td><td>${e.field}</td><td class="mono">${e.raw}</td><td class="mono">${e.clean}</td></tr>`).join('')}</tbody></table>`;
  box.innerHTML=h;
  if(r.status){S.verification=r.status; renderBadge(); renderVerify();
    document.querySelector('nav button[data-p=ver]').click(); $('#rt_res').innerHTML=h;}
}

async function runReproduce(url,file){
  const box=$('#rp_res');
  box.innerHTML='<div class="spin">מריץ ומשווה… זה עשוי לקחת דקה</div>';
  let r;
  if(file){const fd=new FormData(); fd.append('file',file);
    r=await(await fetch2(url,{method:'POST',body:fd})).json();}
  else r=await(await fetch2(url,{method:'POST'})).json();

  if(!r.tables){
    box.innerHTML=`<div class="hint" style="border-color:var(--bad)">${r.msg||'שגיאה'}</div>`+
      (r.log?`<pre>${r.log.replace(/</g,'&lt;')}</pre>`:'');
    return;
  }
  const bad=r.tables.filter(t=>t.status!=='MATCH');
  let h=verdict(r.ok, r.ok
    ? `${r.tables.length} טבלאות הושוו מול <span dir="ltr">${r.source}</span> — כל הערכים זהים`
    : `${bad.length} טבלאות נבדלות`);
  h+='<table><thead><tr><th>טבלה</th><th>תוצאה</th><th>שורות</th><th>עמודות</th><th>תאים שונים</th></tr></thead><tbody>'+
    r.tables.map(t=>`<tr><td class="mono" dir="ltr">${t.table}</td><td>${
      t.status==='MATCH'?'<span class="badge b-ok">זהה</span>':'<span class="badge b-low">נבדל</span>'
    }</td><td class="mono">${NF.format(t.rows)}</td><td class="mono">${t.cols}</td><td class="mono">${t.diff_cells||''}</td></tr>`).join('')+
    '</tbody></table>';
  bad.forEach(t=>{
    h+=`<h2 style="margin-top:18px;font-size:14px" dir="ltr">${t.table}</h2>`;
    if(t.notes.length) h+='<p class="sub">'+t.notes.join(' · ')+'</p>';
    if(t.examples.length) h+='<table><thead><tr><th>עמודה</th><th>שורה</th><th>תאים</th><th>צד א</th><th>צד ב</th></tr></thead><tbody>'+
      t.examples.map(e=>`<tr><td>${e.col}</td><td class="mono">${e.row}</td><td class="mono">${e.n}</td><td class="mono">${e.a}</td><td class="mono">${e.b}</td></tr>`).join('')+'</tbody></table>';
  });
  box.innerHTML=h;
  if(r.status){S.verification=r.status; renderBadge(); renderVerify();
    document.querySelector('nav button[data-p=ver]').click(); $('#rp_res').innerHTML=h;}
}

        <li>עבור ללשונית <b>עדכון</b></li>
        <li>גרור לשם את קובץ ההורדה האחרון מהמערכת</li>
        <li>המערכת תבנה את המסד ותרענן את המסך לבד</li>
      </ol>
      <p class="sub" style="margin-top:14px">אפשר גם לגרור מספר הורדות בזו אחר זו — הן ימוזגו לפי תאריך, וההיסטוריה תישמר.</p></div>`;
    $('#upd').innerHTML='';
    const c=C('div',{className:'card'});
    c.innerHTML=`<h2>הוספת הורדה חדשה</h2>
      <p class="sub">הקובץ נשמר בארכיון והמאגר נבנה מחדש מכל הקבצים יחד. אפשר לגרור לכאן</p>
      <div class="drop" id="drop">גרור לכאן קובץ, או לחץ לבחירה<input type="file" id="fin" accept=".csv" hidden></div>
      <div id="ulog" style="margin-top:14px"></div>`;
    $('#upd').appendChild(c);
    $('#dl').innerHTML=`<div class="card"><h2>הורדת התוצרים</h2>
      <p class="sub">אין עדיין מה להוריד — הארכיון ריק. אחרי שתוסיף הורדה אחת בלשונית עדכון, הטבלאות ייבנו וייפתחו כאן.</p></div>`;
    const d=$('#drop'), fin=$('#fin');
    d.addEventListener('click',()=>fin.click());
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
    d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');
      if(e.dataTransfer.files[0])upload(e.dataTransfer.files[0]);});
    fin.addEventListener('change',()=>fin.files[0]&&upload(fin.files[0]));
    return;
  }
  $('#stamp').textContent=`${NF.format(S.kpi.patients)} מטופלים · ${NF.format(S.kpi.occasions)} שאלונים · עודכן עד ${S.kpi.date_max}`;
  renderOverview(); renderAdherence(); renderTherapist(); renderSample(); renderPatientPanel(); renderUpdate(); renderDownload(); renderVerify(); renderBadge();
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); $('#'+b.dataset.p).classList.add('on');}));

/* ===== shell ===== */

/* =========================================================================
   Startup shell: pick the archive folder, build, show the screens.

   The archive is a real folder on disk - the same one the Python and R
   pipelines read. The browser is granted access to it once and remembers it,
   so there is nothing to upload and nothing to re-select on later visits.
   ========================================================================= */

const GATE = document.getElementById("gate");
const APP = document.getElementById("app");

const helpers = { parseCSV, toCSV, COLUMNS, exportTables, isoDate,
                  ST_ANSWERED, ST_BLANK, ST_NOT };
wireEngine(runPipeline, exportTables);
window.fetch2 = makeFetch(helpers);

function gate(html) { GATE.innerHTML = html; GATE.hidden = false; APP.hidden = true; }
function showApp() { GATE.hidden = true; APP.hidden = false; }

function progressBox(title, note) {
  gate(`<div class="card"><h2>${title}</h2><p class="big" id="pmsg">${note || ""}</p>
        <div class="bar"><i id="pbar"></i></div>
        <p class="muted" id="pnote"></p></div>`);
}
function progress(msg, p) {
  const b = document.getElementById("pbar"), m = document.getElementById("pmsg");
  if (b) b.style.width = Math.round((p || 0) * 100) + "%";
  if (m) m.textContent = msg;
}

function welcome(extra = "") {
  if (!folderSupported()) {
    gate(`<div class="card"><h2>הדפדפן הזה לא נתמך</h2>
      <p class="big">הגישה הקבועה לתיקייה קיימת בכרום ובאדג' בלבד. פתח את הדף
      באחד מהם — פיירפוקס וספארי לא תומכים בזה.</p></div>`);
    return;
  }
  gate(`<div class="card">
    <h2>ניטור שאלונים</h2>
    <p class="big">בחר את תיקיית הארכיון — זו שבה יושבים קבצי ההורדה מהמערכת.
    הדפדפן יזכור אותה, וכל פתיחה הבאה תעלה ישר לנתונים.</p>
    ${extra}
    <button class="act" id="pick">בחר תיקיית ארכיון</button>
    <p class="muted" style="margin-top:16px">הנתונים נקראים מהתיקייה ומחושבים כאן,
    בתוך הדפדפן. שום דבר לא נשלח לשום מקום — לא לאתר הזה ולא לשום שרת.</p>
  </div>`);
  document.getElementById("pick").addEventListener("click", async () => {
    try { await pickFolder(); await start(); }
    catch (e) { if (e && e.name !== "AbortError") welcome(
      `<div class="hint" style="border-color:var(--bad)">לא ניתן לפתוח את התיקייה: ${e.message}</div>`); }
  });
}

async function start() {
  progressBox("בונה את המסד", "רגע");
  await loadConfig(DEFAULT_CFG);
  const light = await build(progress);
  if (!light) {
    gate(`<div class="card"><h2>הארכיון ריק</h2>
      <p class="big">התיקייה שבחרת לא מכילה קבצי הורדה. שים בה את הקובץ האחרון
      שהורדת מהמערכת, ואז רענן.</p>
      <button class="act" id="again">בחר תיקייה אחרת</button></div>`);
    document.getElementById("again").addEventListener("click", () => welcome());
    return;
  }
  showApp();
  await boot();
  const src = { folder: "מהתיקייה", site: "מהאתר", "built-in": "ברירת מחדל" }[DB.cfgSource];
  const st = document.getElementById("stamp");
  if (st) st.title = `הגדרות ${src} · ארכיון: ${DB.dir ? DB.dir.name : ""}`;
}

/* --- adding a new download: write it into the archive, then rebuild -------- */
async function upload(file) {
  const log = document.getElementById("ulog");
  if (log) log.innerHTML = '<div class="spin">שומר בארכיון ובונה מחדש…</div>';
  try {
    await addToArchive(file);
  } catch (e) {
    if (log) log.innerHTML = `<div class="hint" style="border-color:var(--bad)">${
      e.message === "exists" ? `הקובץ ${file.name} כבר בארכיון` :
      "לא ניתן לכתוב לתיקייה"}</div>`;
    return;
  }
  progressBox("בונה מחדש", file.name + " נוסף לארכיון");
  await build(progress, { force: true });
  showApp();
  await boot();
}

/* --- independent reproduction: compare against an R output folder --------- */
async function runReproduce(url, file) {
  const box = document.getElementById("rp_res");
  if (url !== "/api/verify/upload") {
    box.innerHTML = `<div class="hint">דפדפן לא יכול להריץ שפת אר. הרץ במחשב שיש
      בו שפת אר את הפקודה <span class="mono" dir="ltr">Rscript rom_pipeline.R</span>,
      ואז לחץ כאן על <b>בחר תיקיית תוצאה להשוואה</b> ובחר את התיקייה
      <span class="mono" dir="ltr">output_R</span> שנוצרה.</div>`;
    return;
  }
  box.innerHTML = '<div class="spin">קורא ומשווה…</div>';
  let other;
  try {
    const dir = await window.showDirectoryPicker({ id: "rom-compare" });
    other = {};
    for await (const [name, h] of dir.entries())
      if (h.kind === "file" && name.endsWith(".csv"))
        other[name] = await (await h.getFile()).text();
  } catch (e) {
    box.innerHTML = e && e.name === "AbortError" ? "" :
      `<div class="hint" style="border-color:var(--bad)">${e.message}</div>`;
    return;
  }
  const r = await compareWith(other, helpers);
  r.source = "תיקייה שנבחרה";
  renderReproduce(r);
}

function renderReproduce(r) {
  const box = document.getElementById("rp_res");
  const bad = r.tables.filter((t) => t.status !== "MATCH");
  let h = verdict(r.ok, r.ok
    ? `${r.tables.length} טבלאות הושוו מול ${r.source} — כל הערכים זהים`
    : `${bad.length} טבלאות נבדלות`);
  h += '<table><thead><tr><th>טבלה</th><th>תוצאה</th><th>שורות</th><th>עמודות</th><th>תאים שונים</th></tr></thead><tbody>' +
    r.tables.map((t) => `<tr><td class="mono" dir="ltr">${t.table}</td><td>${
      t.status === "MATCH" ? '<span class="badge b-ok">זהה</span>'
                           : '<span class="badge b-low">נבדל</span>'
    }</td><td class="mono">${NF.format(t.rows)}</td><td class="mono">${t.cols}</td><td class="mono">${t.diff_cells || ""}</td></tr>`).join("") +
    "</tbody></table>";
  bad.forEach((t) => {
    h += `<h2 style="margin-top:18px;font-size:14px" dir="ltr">${t.table}</h2>`;
    if (t.notes.length) h += '<p class="sub">' + t.notes.join(" · ") + "</p>";
    if (t.examples.length)
      h += '<table><thead><tr><th>עמודה</th><th>שורה</th><th>תאים</th><th>צד א</th><th>צד ב</th></tr></thead><tbody>' +
        t.examples.map((e) => `<tr><td>${e.col}</td><td class="mono">${e.row}</td><td class="mono">${e.n}</td><td class="mono">${e.a}</td><td class="mono">${e.b}</td></tr>`).join("") +
        "</tbody></table>";
  });
  box.innerHTML = h;
  if (r.status) { S.verification = r.status; renderBadge(); renderVerify();
                  document.querySelector("nav button[data-p=ver]").click();
                  document.getElementById("rp_res").innerHTML = h; }
}

/* the compare button in the verify tab picks a folder rather than a zip */
function relabelVerifyButtons() {
  const up = document.getElementById("rp_up");
  if (up) up.textContent = "בחר תיקיית תוצאה להשוואה";
  const go = document.getElementById("rp_go");
  if (go) go.textContent = "למה אין כאן הרצה אוטומטית";
}
const _renderVerify = renderVerify;
renderVerify = function () { _renderVerify(); relabelVerifyButtons();
  const up = document.getElementById("rp_up");
  if (up) { const c = up.cloneNode(true); up.replaceWith(c);
            c.addEventListener("click", () => runReproduce("/api/verify/upload")); } };

/* ------------------------------------------------------------------ boot */
(async function () {
  if (!folderSupported()) { welcome(); return; }
  const r = await restoreFolder();
  if (r.state === "granted") { await start(); return; }
  if (r.state === "prompt") {
    gate(`<div class="card"><h2>ברוך שובך</h2>
      <p class="big">הדפדפן זוכר את תיקיית הארכיון
      <span class="mono" dir="ltr">${r.name}</span>, וצריך את אישורך כדי לקרוא
      ממנה שוב. לחיצה אחת, ואתה בפנים.</p>
      <button class="act" id="grant">פתח את הארכיון</button>
      <p class="muted" style="margin-top:14px">אפשר גם
      <a href="#" id="other">לבחור תיקייה אחרת</a>.</p></div>`);
    document.getElementById("grant").addEventListener("click", async () => {
      if (await grantFolder(r.dir)) await start();
      else welcome('<div class="hint" style="border-color:var(--bad)">ההרשאה לא ניתנה</div>');
    });
    document.getElementById("other").addEventListener("click", (e) => {
      e.preventDefault(); welcome();
    });
    return;
  }
  welcome();
})();
